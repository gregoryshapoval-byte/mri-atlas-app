name: Inspect female pelvis archive
on:
  push:
    paths:
      - '.github/workflows/inspect-female-pelvis.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source archive
        run: |
          python - <<'PY'
          import zipfile,collections,io,sqlite3,tempfile,os
          with zipfile.ZipFile('female-pelvis-source-minimal.zip') as outer:
            db=outer.read('eAnatomy.db')
            print('DB HEADER:',repr(db[:64]))
            with tempfile.NamedTemporaryFile(delete=False) as temp: temp.write(db); path=temp.name
            try:
              c=sqlite3.connect('file:'+path+'?mode=ro',uri=True)
              print('SQLITE TABLES:',c.execute("select name,sql from sqlite_master where type='table' limit 20").fetchall())
            except Exception as e:print('DB ERROR:',str(e))
            finally:os.unlink(path)
            with zipfile.ZipFile(io.BytesIO(outer.read('pelvis.zip'))) as inner:
              names=inner.namelist(); print('PELVIS ZIP FILES',len(names))
              print('FIRST 100:');print('\n'.join(names[:100]))
              print('SIGNATURES:')
              for n in names[:12]:
                blob=inner.read(n)
                print(n[:12],len(blob),repr(blob[:18]))
          PY
