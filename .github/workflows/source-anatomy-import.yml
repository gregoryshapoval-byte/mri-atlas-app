name: Source anatomy import environment

on:
  push:
    paths:
      - '.github/workflows/source-anatomy-import.yml'
      - 'tools/recover_source_database.py'
      - 'tools/import_source_modules.py'
      - 'female-pelvis-source-minimal.zip'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Run ID containing private artifact named eanatomy-source (leave empty for dependency test)'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  source-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install recovery dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install androguard sqlcipher3-binary pillow
      - name: Verify SQLCipher and image tooling
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from PIL import Image
          from sqlcipher3 import dbapi2 as sqlcipher
          import androguard
          connection = sqlcipher.connect(':memory:')
          result = connection.execute('PRAGMA cipher_version').fetchone()
          assert result and result[0], 'SQLCipher extension not available'
          print('Recovery dependencies installed; SQLCipher is available.')
          print('androguard', version('androguard'))
          print('sqlcipher3-binary', version('sqlcipher3-binary'))
          print('Pillow', version('pillow'))
          connection.close()
          PY
      - name: Validate recovery scripts
        run: python -m py_compile tools/recover_source_database.py tools/import_source_modules.py
      - name: Recover female pelvis source labels from repository archive
        run: |
          test -f female-pelvis-source-minimal.zip
          python tools/recover_source_database.py female-pelvis-source-minimal.zip /tmp/atlas-recovery
          python tools/import_source_modules.py /tmp/atlas-recovery app/src/main/assets --modules pelvis --report /tmp/female-pelvis-source-report.json
      - name: Upload verified female pelvis data
        uses: actions/upload-artifact@v4
        with:
          name: female-pelvis-verified-annotations
          path: |
            app/src/main/assets/female-pelvis-mri-data.json
            app/src/main/assets/female-pelvis-mri-labels.json
            app/src/main/assets/female-pelvis-mri-images/
          retention-days: 7
