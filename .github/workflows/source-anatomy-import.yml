name: Source anatomy import environment

on:
  push:
    paths:
      - '.github/workflows/source-anatomy-import.yml'
      - 'tools/recover_source_database.py'
      - 'tools/import_source_modules.py'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Run ID containing private artifact named eanatomy-source (leave empty for dependency test)'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  source-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install recovery dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install androguard sqlcipher3-binary pillow
      - name: Verify SQLCipher and image tooling
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from PIL import Image
          from sqlcipher3 import dbapi2 as sqlcipher
          import androguard
          connection = sqlcipher.connect(':memory:')
          result = connection.execute('PRAGMA cipher_version').fetchone()
          assert result and result[0], 'SQLCipher extension not available'
          print('Recovery dependencies installed; SQLCipher is available.')
          print('androguard', version('androguard'))
          print('sqlcipher3-binary', version('sqlcipher3-binary'))
          print('Pillow', version('pillow'))
          connection.close()
          PY
      - name: Validate recovery scripts
        run: python -m py_compile tools/recover_source_database.py tools/import_source_modules.py
      - name: Check prerequisites (without exposing database key)
        env:
          SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id }}
        run: |
          if [ -z "$SOURCE_RUN_ID" ]; then
            echo 'Dependency test completed. No private source archive requested.'
            exit 0
          fi
          test -f tools/recover_source_database.py || { echo 'Missing tools/recover_source_database.py'; exit 1; }
          test -f tools/import_source_modules.py || { echo 'Missing tools/import_source_modules.py'; exit 1; }
      - name: Download private archive from an Actions artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          mkdir -p /tmp/atlas-input
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name eanatomy-source --dir /tmp/atlas-input
          test -f /tmp/atlas-input/net.imaios.eanatomy.zip || { echo 'Expected archive not found'; exit 1; }
      - name: Recover female-pelvis source labels
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id != '' }}
        run: |
          python tools/recover_source_database.py /tmp/atlas-input/net.imaios.eanatomy.zip /tmp/atlas-recovery
          python tools/import_source_modules.py /tmp/atlas-recovery app/src/main/assets --modules pelvis --report /tmp/female-pelvis-source-report.json
          echo 'Import finished locally on runner. No decrypted database or source archive is published.'
      - name: Save verified female pelvis annotation import
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: female-pelvis-verified-annotations
          path: |
            app/src/main/assets/female-pelvis-mri-data.json
            app/src/main/assets/female-pelvis-mri-labels.json
            app/src/main/assets/female-pelvis-mri-images/
            /tmp/female-pelvis-source-report.json
          retention-days: 7
