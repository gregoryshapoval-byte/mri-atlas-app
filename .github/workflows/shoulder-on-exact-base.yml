name: Shoulder on first post-1.30 APK
on:
  workflow_dispatch:
  push:
    branches: [work/shoulder-on-1-4-from-1-30]
    paths: [.github/workflows/shoulder-on-exact-base.yml]
permissions:
  contents: read
  actions: read
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install source recovery
        run: python3 -m pip install --quiet androguard sqlcipher3-binary pillow
      - name: Use first successful 1.4 artifact after 1.30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/input
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12142397489/zip" > /tmp/base-artifact.zip
          unzip -Z -1 /tmp/base-artifact.zip | tee /tmp/base-content.txt
          BASE_ENTRY="$(grep -Ei '(^|/).*\\.apk$' /tmp/base-content.txt | head -n 1)"
          test -n "$BASE_ENTRY" || { echo "::error::No APK in selected 1.4-from-1.30 artifact"; exit 1; }
          unzip -p /tmp/base-artifact.zip "$BASE_ENTRY" > /tmp/input/MRIAtlas-1.4-from-1.30.apk
          python3 - <<'PY'
          import zipfile,hashlib
          p='/tmp/input/MRIAtlas-1.4-from-1.30.apk'
          with zipfile.ZipFile(p) as z:
              assert 'assets/regions.js' in z.namelist(), 'Wrong APK: missing assets/regions.js'
              print('Selected first successful post-1.30 1.4 APK:', p)
              print('SHA256:', hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
      - name: Download existing IMAIOS source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download source-archive-1 -R "$GITHUB_REPOSITORY" -p 'net.imaios.eanatomy.zip' -D /tmp/input
      - name: Verify and import shoulder anatomy
        run: |
          mkdir -p /tmp/shoulder-source
          python3 tools/recover_shoulder_source.py /tmp/input/net.imaios.eanatomy.zip /tmp/shoulder-source
          python3 tools/import_shoulder_source.py /tmp/shoulder-source app/src/main/assets --report /tmp/shoulder-import-report.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/shoulder-import-report.json'))
          assert r['uniqueSlices']==115 and r['points']==3151 and r['frames']>=230, r
          print(r)
          PY
      - name: Patch only selected base APK
        run: |
          python3 tools/patch_shoulder_into_base_apk.py /tmp/input/MRIAtlas-1.4-from-1.30.apk app/src/main/assets /tmp/shoulder-unsigned.apk
      - name: Configure Android Build Tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
      - name: Sign and validate installable APK
        env:
          APK_KEYSTORE_B64: ${{ secrets.ATLAS_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASS: ${{ secrets.ATLAS_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.ATLAS_KEY_ALIAS }}
          APK_KEY_PASS: ${{ secrets.ATLAS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 /tmp/shoulder-unsigned.apk /tmp/shoulder-aligned.apk
          if [ -n "$APK_KEYSTORE_B64" ] && [ -n "$APK_KEYSTORE_PASS" ] && [ -n "$APK_KEY_ALIAS" ] && [ -n "$APK_KEY_PASS" ]; then
            printf '%s' "$APK_KEYSTORE_B64" | base64 -d > /tmp/atlas.jks
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/atlas.jks --ks-pass "pass:$APK_KEYSTORE_PASS" --key-pass "pass:$APK_KEY_PASS" --ks-key-alias "$APK_KEY_ALIAS" --out build/MRIAtlas-1.4-from-1.30-shoulder.apk /tmp/shoulder-aligned.apk
          else
            echo "Signing secrets absent: generating a test key. This APK cannot update an installation signed with another key."
            keytool -genkeypair -keystore /tmp/test.jks -storepass android -keypass android -alias test -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=MRI Atlas Test' >/dev/null
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/test.jks --ks-pass pass:android --key-pass pass:android --ks-key-alias test --out build/MRIAtlas-1.4-from-1.30-shoulder.apk /tmp/shoulder-aligned.apk
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/MRIAtlas-1.4-from-1.30-shoulder.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/MRIAtlas-1.4-from-1.30-shoulder.apk | head -8
      - uses: actions/upload-artifact@v4
        with:
          name: MRIAtlas-1.4-from-1.30-with-shoulder
          path: |
            build/MRIAtlas-1.4-from-1.30-shoulder.apk
            /tmp/shoulder-import-report.json
          retention-days: 14
