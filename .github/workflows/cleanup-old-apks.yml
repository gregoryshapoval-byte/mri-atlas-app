name: Clean obsolete APK artifacts
on:
  push:
    paths:
      - .github/workflows/cleanup-old-apks.yml
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only older APK artifacts, preserve 1.3 and 1.4
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const artifacts=await github.paginate(github.rest.actions.listArtifactsForRepo,{owner,repo,per_page:100});
            const old=artifacts.filter(a => /^MRIAtlas-/i.test(a.name) && !/^MRIAtlas-1\.(?:3(?:0)?|4)(?:-|$)/i.test(a.name));
            core.info('Total artifacts: '+artifacts.length+'; obsolete APK artifacts: '+old.length);
            for(const a of old){
              await github.rest.actions.deleteArtifact({owner,repo,artifact_id:a.id});
              core.info('Deleted '+a.name+' id='+a.id);
            }
            core.info('Preserved all 1.3/1.30 and 1.4 APK artifacts. Other artifacts, source code, branches and workflow runs unchanged.');
