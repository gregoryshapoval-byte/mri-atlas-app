name: Sign existing MRI Atlas 1.83 APK
on:
  push:
    branches: [work/orads-simplify-1-83]
    paths: [.github/workflows/sign-atlas183.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas-release-signing
  cancel-in-progress: false
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Owner-requested public test identity. Always restore; never regenerate.
    env:
      ATLAS_STORE_PASSWORD: android
      ATLAS_KEY_PASSWORD: android
      ATLAS_KEY_ALIAS: atlas
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore the permanent public test key backup
        run: |
          set -euo pipefail
          mkdir -p saved-key signing
          gh release download atlas-1.83-personal-backup --pattern MRIAtlas-test-signing-key.zip --dir saved-key
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          p=Path('saved-key/MRIAtlas-test-signing-key.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='21e95c8f3b3b57579f8ad930e5dd011a7800efccc00750b003d70a5a9d9c87c6'
          with ZipFile(p) as z:
              assert z.testzip() is None
              for name in ['atlas.keystore','certificate.der','certificate.sha256','README.txt']:
                  Path('signing',name).write_bytes(z.read(name))
          PY
          keytool -exportcert -keystore signing/atlas.keystore -storepass:env ATLAS_STORE_PASSWORD \
            -alias "$ATLAS_KEY_ALIAS" -file current-cert.der
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          assert hashlib.sha256(Path('current-cert.der').read_bytes()).hexdigest()=='cb7d43e1eb8ff4c1eee663e918b5413b70fb9d6f8221790075f83c7e153624fe'
          assert Path('current-cert.der').read_bytes()==Path('signing/certificate.der').read_bytes()
          PY
      - name: Download exact previously built APK
        uses: actions/download-artifact@v4
        with:
          name: MRIAtlas-1.83-unsigned
          run-id: 39459133181
          github-token: ${{ github.token }}
          path: input
      - name: Check original APK checksum and ZIP
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from zipfile import ZipFile
          p=Path('input/MRIAtlas-1.83-unsigned.apk')
          info=json.loads(Path('input/MRIAtlas-1.83-build-info.json').read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==info['sha256'], 'Input checksum mismatch'
          with ZipFile(p) as z:
              assert z.testzip() is None, 'Invalid input ZIP'
          PY
      - name: Install Android signing tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          bt="$ANDROID_HOME/build-tools/35.0.0"
          "$bt/zipalign" -c 4 input/MRIAtlas-1.83-unsigned.apk
          "$bt/apksigner" sign --ks signing/atlas.keystore \
            --ks-pass env:ATLAS_STORE_PASSWORD --key-pass env:ATLAS_KEY_PASSWORD \
            --ks-key-alias "$ATLAS_KEY_ALIAS" --v2-signing-enabled true --v3-signing-enabled true \
            --v4-signing-enabled false --out output/MRIAtlas-1.83-signed.apk input/MRIAtlas-1.83-unsigned.apk
          "$bt/apksigner" verify --verbose --print-certs output/MRIAtlas-1.83-signed.apk | tee output/signature.txt
          "$bt/aapt2" dump badging output/MRIAtlas-1.83-signed.apk > output/package-info.txt
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib,json
          source=Path('input/MRIAtlas-1.83-unsigned.apk')
          result=Path('output/MRIAtlas-1.83-signed.apk')
          with ZipFile(source) as a, ZipFile(result) as b:
              assert b.testzip() is None
              original=set(a.namelist())
              assert original.issubset(set(b.namelist()))
              for name in original:
                  assert a.read(name)==b.read(name), 'Payload changed: '+name
              assert all(n.startswith('META-INF/') for n in set(b.namelist())-original)
          package=Path('output/package-info.txt').read_text().splitlines()[0]
          assert "name='ru.grigory.shoulderatlas.restored'" in package
          assert "versionCode='83'" in package and "versionName='1.83'" in package
          cert=hashlib.sha256(Path('signing/certificate.der').read_bytes()).hexdigest()
          old='9cc66233387f434c95059fc032f12bf3fbed77345bca5d976e32e45b877cec14'
          Path('output/build-info.json').write_text(json.dumps({
            'version':'1.83','signed':True,'payload_unchanged':True,
            'certificate_sha256':cert,'matches_previous_release_key':cert==old,
            'sha256':hashlib.sha256(result.read_bytes()).hexdigest()
          },indent=2))
          PY
      - name: Upload verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MRIAtlas-1.83-signed
          path: output/
          if-no-files-found: error
          retention-days: 30
      - name: Remove runner copy of key
        if: always()
        run: rm -rf signing
