name: Verify current MRIAtlas APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore pinned runtime and check current search
        run: |
          python3 tools/prepare_runtime.py
          node tests/current345.mjs
          python3 tests/runtime-integrity345.py
          python3 tools/verify_current.py
      - name: Check direct links and browser layout
        run: |
          npm install --prefix build/test-deps --no-audit --no-fund linkedom@0.18.12 playwright@1.56.1
          export ATLAS_DOM="$PWD/build/test-deps/node_modules/linkedom/esm/index.js"
          node tests/dom-smart345.mjs smart2024
          node tests/dom-smart345.mjs smart-rifil
          node tests/dom-smart345.mjs smart-hope
          build/test-deps/node_modules/.bin/playwright install --with-deps chromium
          PLAYWRIGHT_IMPORT="$PWD/build/test-deps/node_modules/playwright/index.mjs" node tests/browser-current345.mjs
      - name: Build and verify unsigned current APK
        run: UNSIGNED_ONLY=1 bash build-apk.sh --prepared
      - name: Record verification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-runtime-verification
          path: |
            build/current-verification.json
            build/browser-current345.json
          if-no-files-found: ignore
          retention-days: 7
