name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, 'work/wrist-tfcc-1-30', 'work/female-pelvis-on-1-30' ]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Check annotation data and viewer math
        run: |
          node tests/wrist-mri.mjs
          node tests/female-pelvis-source.mjs
          node tests/brain-screen-labels.mjs
          node tests/brain-frame-cache.mjs

      - name: Build APK
        shell: bash
        run: |
          chmod +x ./build-apk.sh
          ANDROID_SDK_ROOT="$ANDROID_HOME" UNSIGNED_ONLY=1 ./build-apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MRIAtlas-1.4-unsigned
          path: build/MRIAtlas-1.4-unsigned.apk
          if-no-files-found: error
          retention-days: 30
