name: MRI Atlas 2.22 - Sacroiliitis and mimics
# Schizas: decode loaded scheme images; empty dialog image is intentionally deferred.
on:
  push:
    branches: [work/orads-simplify-1-83]
    paths: [.github/workflows/sacroiliitis222-requested-build.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: atlas-release-signing
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ATLAS_STORE_PASSWORD: android
      ATLAS_KEY_PASSWORD: android
      ATLAS_KEY_ALIAS: atlas
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preservation of all previous assets
        run: |
          python3 - <<'PY'
          import subprocess
          base='8b9fe789982d5105e083768d01b54acf5efedbf2'
          def tree(ref):
              raw=subprocess.check_output(['git','ls-tree','-r','-z',ref,'app/src/main/assets'])
              result={}
              for entry in raw.split(b'\0'):
                  if not entry: continue
                  meta,p=entry.split(b'\t',1)
                  result[p.decode()]=meta.split()[2]
              return result
          a,b=tree(base),tree('HEAD')
          for p,h in a.items():
              if p in {'app/src/main/assets/anatomy-regions.js','app/src/main/assets/index.html'}: continue
              assert b.get(p)==h, 'Prior asset changed or deleted: '+p
          print('PASS unchanged previous assets:',len(a)-2)
          PY
      - name: Restore image assets
        run: |
          python3 tools/materialize_assets142.py
          python3 tools/materialize_assets150.py
          python3 tools/materialize_assets152.py
          python3 tools/materialize_assets165.py
      - name: Check routes and source data
        run: |
          node --check app/src/main/assets/brain-tumors-age.js
          node --check app/src/main/assets/pilocytic.js
          node --check app/src/main/assets/craniopharyngioma.js
          node --check app/src/main/assets/ependymal.js
          node --check app/src/main/assets/hemangioblastoma.js
          node --check app/src/main/assets/vestibular.js
          node --check app/src/main/assets/glioneuronal.js
          node --check app/src/main/assets/neurocytoma.js
          node --check app/src/main/assets/stroke.js
          node --check app/src/main/assets/vascular-malformations.js
          node --check app/src/main/assets/small-vessel.js
          node --check app/src/main/assets/small-vessel-figures.js
          node --check app/src/main/assets/atrophy.js
          node --check app/src/main/assets/atrophy-figures.js
          node --check app/src/main/assets/brain-cysts.js
          node --check app/src/main/assets/brain-cysts-data.js
          node --check app/src/main/assets/brain-cysts-figures.js
          node --check app/src/main/assets/csf-disorders.js
          node --check app/src/main/assets/csf-disorders-figures.js
          node --check app/src/main/assets/epilepsy.js
          node --check app/src/main/assets/epilepsy-data.js
          node --check app/src/main/assets/epilepsy-figures.js
          node --check app/src/main/assets/brain-trauma.js
          node --check app/src/main/assets/brain-trauma-data.js
          node --check app/src/main/assets/brain-trauma-figures.js
          node --check app/src/main/assets/toxic-hypoxic.js
          node --check app/src/main/assets/toxic-hypoxic-data.js
          node --check app/src/main/assets/toxic-hypoxic-figures.js
          node --check app/src/main/assets/venous-aneurysm-sah.js
          node --check app/src/main/assets/venous-aneurysm-sah-data.js
          node --check app/src/main/assets/venous-aneurysm-sah-figures.js
          node --check app/src/main/assets/endometriosis.js
          node --check app/src/main/assets/endometriosis-data.js
          node --check app/src/main/assets/endometriosis-figures.js
          node --check app/src/main/assets/brain-metastases-signals210.js
          node --check app/src/main/assets/brain-metastases-primary211.js
          node --check app/src/main/assets/brain-metastases-followup.js
          node --check app/src/main/assets/brain-metastases-followup-data.js
          node --check app/src/main/assets/brain-metastases-followup-figures.js
          node --check app/src/main/assets/bone-marrow.js
          node --check app/src/main/assets/bone-marrow-data.js
          node --check app/src/main/assets/bone-marrow-figures.js
          node --check app/src/main/assets/liver-lesions.js
          node --check app/src/main/assets/liver-lesions-data.js
          node --check app/src/main/assets/liver-lesions-figures.js
          node --check app/src/main/assets/spinal-infection.js
          node --check app/src/main/assets/spinal-infection-data.js
          node --check app/src/main/assets/spinal-infection-figures.js
          python3 -c 'from pathlib import Path; import xml.etree.ElementTree as E; files=list(Path("app/src/main/assets/schizas").glob("*.svg")); assert len(files)==7; [E.parse(p) for p in files]; print("PASS seven Schizas XML schemes")'
          python3 -c 'from pathlib import Path; import xml.etree.ElementTree as E; files=list(Path("app/src/main/assets/osteonecrosis").glob("*.svg")); assert len(files)==17; [E.parse(p) for p in files]; print("PASS 17 osteonecrosis XML schemes")'
          python3 -c 'from pathlib import Path; import xml.etree.ElementTree as E; files=list(Path("app/src/main/assets/sacroiliitis").glob("*.svg")); assert len(files)==17; [E.parse(p) for p in files]; print("PASS 17 sacroiliitis XML schemes")'
          node tests/sacroiliitis222.mjs
          node --check app/src/main/assets/sacroiliitis.js
          node tests/osteonecrosis221.mjs
          node --check app/src/main/assets/osteonecrosis.js
          node tests/disc220.mjs
          node --check app/src/main/assets/disc-nerve.js
          node tests/schizas219.mjs
          node --check app/src/main/assets/schizas.js
          node tests/spinal215.mjs
          node tests/glioma217.mjs
          node tests/branding218.mjs
          node --check app/src/main/assets/glioma-followup.js
          node tests/brain-screen-labels.mjs
          node tests/viewer-fit159.mjs
          node tests/liver214.mjs
          node tests/marrow213.mjs
          node tests/followup212.mjs
          node tests/primary211.mjs
          node tests/clinical210.mjs
          node tests/vessels209.mjs
          node tests/toxic208.mjs
          node tests/trauma207.mjs
          node tests/epilepsy206.mjs
          node tests/neuro205.mjs
          node tests/cysts204.mjs
          node tests/csf203.mjs
          node tests/atrophy202.mjs
          node tests/vascular200.mjs
          node tests/svd201.mjs
          node tests/stroke199.mjs
          node tests/neuronal198.mjs
          node tests/age197.mjs
          node tests/ependymal196.mjs
          node tests/hemangioblastoma195.mjs
          node tests/vestibular194.mjs
          node tests/sellar193.mjs
          node tests/lymphoma192.mjs
          node tests/diffuse191.mjs
          node tests/meningioma190.mjs
          node tests/metastases189.mjs
          node tests/brain188.mjs
          node tests/prostate187.mjs
          node tests/catalog142.mjs
          node tests/home163.mjs
          node tests/all-mri-data.mjs
      - name: Install browser dependency
        run: npm install --prefix /tmp/atlas-dom playwright --no-audit --no-fund
      - name: Check sacroiliitis and preserved menus
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node tests/browser-branding218.mjs
          node tests/menus142.mjs
          node tests/browser-schizas219.mjs
          node tests/browser-sacroiliitis222.mjs
          node tests/browser-osteonecrosis221.mjs
          node tests/browser-disc220.mjs
      - name: Upload UI review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacroiliitis222-ui-review
          path: |
            review/browser-branding218/
            review/browser-1.42/
            review/browser-schizas219/
            review/browser-disc220/
            review/browser-osteonecrosis221/
            review/browser-sacroiliitis222/
          if-no-files-found: ignore
          retention-days: 7
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: |
          chmod +x build-apk.sh
          ANDROID_SDK_ROOT="$ANDROID_HOME" UNSIGNED_ONLY=1 ./build-apk.sh
      - name: Restore the same saved test signing key
        run: |
          set -euo pipefail
          mkdir -p saved-key signing
          gh release download atlas-1.83-personal-backup --pattern MRIAtlas-test-signing-key.zip --dir saved-key
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          p=Path('saved-key/MRIAtlas-test-signing-key.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='21e95c8f3b3b57579f8ad930e5dd011a7800efccc00750b003d70a5a9d9c87c6'
          with ZipFile(p) as z:
              assert z.testzip() is None
              Path('signing/atlas.keystore').write_bytes(z.read('atlas.keystore'))
              Path('signing/certificate.der').write_bytes(z.read('certificate.der'))
          PY
          keytool -exportcert -keystore signing/atlas.keystore -storepass:env ATLAS_STORE_PASSWORD -alias atlas -file current-cert.der
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          assert hashlib.sha256(Path('current-cert.der').read_bytes()).hexdigest()=='cb7d43e1eb8ff4c1eee663e918b5413b70fb9d6f8221790075f83c7e153624fe'
          assert Path('current-cert.der').read_bytes()==Path('signing/certificate.der').read_bytes()
          PY
      - name: Sign and verify payload and version
        run: |
          set -euo pipefail
          mkdir -p output
          bt="$ANDROID_HOME/build-tools/35.0.0"
          "$bt/zipalign" -c 4 build/MRIAtlas-2.22-unsigned.apk
          "$bt/apksigner" sign --ks signing/atlas.keystore --ks-pass env:ATLAS_STORE_PASSWORD --key-pass env:ATLAS_KEY_PASSWORD --ks-key-alias atlas --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false --out output/MRIAtlas-2.22.apk build/MRIAtlas-2.22-unsigned.apk
          "$bt/apksigner" verify --verbose --print-certs output/MRIAtlas-2.22.apk | tee output/signature.txt
          "$bt/aapt2" dump badging output/MRIAtlas-2.22.apk > output/package-info.txt
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib,json
          p=Path('output/MRIAtlas-2.22.apk')
          with ZipFile('build/MRIAtlas-2.22-unsigned.apk') as a, ZipFile(p) as b:
              assert b.testzip() is None
              original=set(a.namelist())
              assert original.issubset(set(b.namelist()))
              for n in original: assert a.read(n)==b.read(n),'Payload changed: '+n
              assert all(n.startswith('META-INF/') for n in set(b.namelist())-original)
              for f in Path('app/src/main/assets').rglob('*'):
                  if f.is_file(): assert b.read('assets/'+f.relative_to('app/src/main/assets').as_posix())==f.read_bytes()
              assert 'sacroiliitis.html?from=spine' in b.read('assets/anatomy-regions.js').decode()
              assert 'sacroiliitis.html?from=pelvis' in b.read('assets/anatomy-regions.js').decode()
              assert 'Сакроилиит' in b.read('assets/sacroiliitis.html').decode()
              assert 'osteonecrosis.html' in b.read('assets/anatomy-regions.js').decode()
              assert 'Аваскулярный некроз' in b.read('assets/osteonecrosis.html').decode()
              assert 'arco3a' in b.read('assets/osteonecrosis-data.js').decode()
              assert 'disc-nerve.html' in b.read('assets/anatomy-regions.js').decode()
              assert 'Диски и корешки' in b.read('assets/disc-nerve.html').decode()
              assert 'lee3' in b.read('assets/disc-nerve-data.js').decode()
              assert 'schizas.html' in b.read('assets/anatomy-regions.js').decode()
              assert 'Schizas' in b.read('assets/schizas.html').decode()
              assert 'brain-metastases-followup.html' in b.read('assets/anatomy-regions.js').decode()
              assert 'bone-marrow.html?from=knee' in b.read('assets/anatomy-regions.js').decode()
              assert 'glioma-followup.html' in b.read('assets/anatomy-regions.js').decode()
              assert 'Глиомы после лечения' in b.read('assets/glioma-followup.html').decode()
              assert 'RANO 2.0' in b.read('assets/glioma-followup-data.js').decode()
              assert 'spinal-infection.html' in b.read('assets/anatomy-regions.js').decode()
              assert 'Спондилодисцит и имитаторы' in b.read('assets/spinal-infection.html').decode()
              assert 'liver-lesions.html' in b.read('assets/anatomy-regions.js').decode()
              assert 'Очаговые образования печени' in b.read('assets/liver-lesions.html').decode()
              assert 'Костный мозг' in b.read('assets/bone-marrow.html').decode()
              assert 'Метастазы после лечения' in b.read('assets/brain-metastases-followup.html').decode()
              assert 'brain-tumors' in b.read('assets/anatomy-regions.js').decode()
              assert 'brain-metastases.html' in b.read('assets/brain-tumors.html').decode()
              assert 'ependymal.html' in b.read('assets/brain-tumors.html').decode()
              assert 'Пилоцитарная астроцитома' in b.read('assets/pilocytic.html').decode()
              assert 'Краниофарингиома' in b.read('assets/craniopharyngioma.html').decode()
              assert 'Ганглиоглиома / ДНЭО' in b.read('assets/glioneuronal.html').decode()
              assert 'Центральная нейроцитома' in b.read('assets/neurocytoma.html').decode()
              assert 'Инсульты' in b.read('assets/stroke.html').decode()
              assert 'Кисты и кистозные изменения' in b.read('assets/brain-cysts.html').decode()
              assert 'Инфекции головного мозга' in b.read('assets/brain-infections.html').decode()
              assert 'Эндометриоз' in b.read('assets/endometriosis.html').decode()
              assert 'endometriosis.html' in b.read('assets/anatomy-regions.js').decode()
              assert 'melanoma' in b.read('assets/brain-metastases-data.js').decode()
              assert 'Венозный тромбоз, аневризмы и САК' in b.read('assets/venous-aneurysm-sah.html').decode()
              assert 'venous-aneurysm-sah.html' in b.read('assets/anatomy-regions.js').decode()
              assert 'Токсические и гипоксические поражения' in b.read('assets/toxic-hypoxic.html').decode()
              assert 'toxic-hypoxic.html' in b.read('assets/anatomy-regions.js').decode()
              assert 'Черепно-мозговая травма' in b.read('assets/brain-trauma.html').decode()
              assert 'brain-trauma.html' in b.read('assets/anatomy-regions.js').decode()
              assert 'Эпилептогенные изменения' in b.read('assets/epilepsy.html').decode()
              assert 'epilepsy.html' in b.read('assets/anatomy-regions.js').decode()
              assert 'Демиелинизация' in b.read('assets/demyelination.html').decode()
              assert 'mcdonald205' in b.read('assets/multiple-sclerosis.html').decode()
              assert 'brain-cysts.html' in b.read('assets/anatomy-regions.js').decode()
              assert 'Гидроцефалия и ликворные нарушения' in b.read('assets/csf-disorders.html').decode()
              assert 'csf-disorders.html' in b.read('assets/anatomy-regions.js').decode()
              assert 'Атрофия и когнитивные нарушения' in b.read('assets/atrophy.html').decode()
              assert 'atrophy.html' in b.read('assets/anatomy-regions.js').decode()
              assert 'Болезнь мелких сосудов' in b.read('assets/small-vessel.html').decode()
              assert 'small-vessel.html' in b.read('assets/anatomy-regions.js').decode()
              assert 'Сосудистые мальформации' in b.read('assets/vascular-malformations.html').decode()
              assert 'vascular-malformations.html' in b.read('assets/anatomy-regions.js').decode()
              assert 'stroke.html' in b.read('assets/anatomy-regions.js').decode()
              assert 'data-age' in b.read('assets/brain-tumors.html').decode()
          package=Path('output/package-info.txt').read_text().splitlines()[0]
          assert "name='ru.grigory.shoulderatlas.restored'" in package
          assert "application-label:'MRIAtlas'" in Path('output/package-info.txt').read_text()
          assert "versionCode='122'" in package and "versionName='2.22'" in package
          signature=Path('output/signature.txt').read_text().lower()
          assert 'cb7d43e1eb8ff4c1eee663e918b5413b70fb9d6f8221790075f83c7e153624fe' in signature
          assert 'verified using v2 scheme (apk signature scheme v2): true' in signature
          assert 'verified using v3 scheme (apk signature scheme v3): true' in signature
          info={'version':'2.22','signed':True,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size,'certificate_sha256':'cb7d43e1eb8ff4c1eee663e918b5413b70fb9d6f8221790075f83c7e153624fe','payload_verified':True,'base_commit':'8b9fe789982d5105e083768d01b54acf5efedbf2','commit':__import__('os').environ['GITHUB_SHA']}
          Path('output/build-info.json').write_text(json.dumps(info,indent=2))
          PY
      - name: Save signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MRIAtlas-2.22-signed
          path: output/
          if-no-files-found: error
          retention-days: 30
      - name: Save installable APK in permanent personal release
        continue-on-error: true # APK remains available in the signed artifact if release permission is unavailable.
        run: |
          gh release create atlas-2.22-sacroiliitis output/MRIAtlas-2.22.apk output/build-info.json output/signature.txt --target "$GITHUB_SHA" --prerelease --title "MRI Atlas 2.22 - Sacroiliitis and mimics" --notes "Сакроилиит: активность/структура, ASAS и диагностические ограничения, OCI/нагрузка/после родов/инфекция/перелом; четырёхсерийный ASAS-SPARTAN2024протокол,17схем,7шаблонов. Предыдущие модули/МРТ/метки сохранены. Физический Android не проверен."
      - name: Clean runner key copy
        if: always()
        run: rm -rf signing saved-key current-cert.der
