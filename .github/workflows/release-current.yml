name: Publish current signed MRIAtlas
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-release-signing
  cancel-in-progress: false
jobs:
  release-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare verified current runtime
        run: |
          python3 tools/prepare_runtime.py
          node tests/current345.mjs
          python3 tests/runtime-integrity345.py
          python3 tools/verify_current.py
          echo "ATLAS_VERSION=$(python3 tools/release_metadata.py --version)" >> "$GITHUB_ENV"
      - name: Check direct links and browser layout
        run: |
          npm install --prefix build/test-deps --no-audit --no-fund linkedom@0.18.12 playwright@1.56.1
          export ATLAS_DOM="$PWD/build/test-deps/node_modules/linkedom/esm/index.js"
          node tests/dom-smart345.mjs smart2024
          node tests/dom-smart345.mjs smart-rifil
          node tests/dom-smart345.mjs smart-hope
          build/test-deps/node_modules/.bin/playwright install --with-deps chromium
          PLAYWRIGHT_IMPORT="$PWD/build/test-deps/node_modules/playwright/index.mjs" node tests/browser-current345.mjs
      - name: Restore previous key and sign preserved native payload
        run: |
          python3 tools/restore_signing_key.py
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          APKSIGNER_JAR="$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" bash build-apk.sh --prepared
      - name: Publish APK only and verify download
        run: |
          tag="atlas-${ATLAS_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite a published APK.' >&2
            exit 1
          fi
          gh release create "$tag" "build/MRIAtlas-${ATLAS_VERSION}.apk" --target "$GITHUB_SHA" --title "MRIAtlas ${ATLAS_VERSION}" --notes-file review/release-current.md --latest
          mkdir -p build/download-verification
          gh release download "$tag" --pattern "MRIAtlas-${ATLAS_VERSION}.apk" --dir build/download-verification
          cmp "build/MRIAtlas-${ATLAS_VERSION}.apk" "build/download-verification/MRIAtlas-${ATLAS_VERSION}.apk"
          echo "Published and downloaded APK match: ${tag}" >> "$GITHUB_STEP_SUMMARY"
      - name: Record checks separately from the release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-current-verification
          path: |
            build/current-verification.json
            build/browser-current345.json
          if-no-files-found: ignore
          retention-days: 7
