name: Publish current signed MRIAtlas
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-release-signing
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Read the current version and validate real images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,os,json,hashlib
          text=Path('app/build.gradle').read_text()
          version=re.search(r"versionName '([^']+)'",text).group(1)
          code=int(re.search(r'versionCode (\d+)',text).group(1))
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('ATLAS_VERSION='+version+'\nATLAS_CODE='+str(code)+'\n')
          images=json.loads(Path('app/src/main/assets/liver-cases/ATTRIBUTION.json').read_text())['images']
          assert len(images)==24
          for image in images:
              p=Path('app/src/main/assets/liver-cases')/image['file']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==image['sha256']
          PY
          node --check app/src/main/assets/liver-cases.js
          node --check app/src/main/assets/liver-cases-data.js
          node tests/panel-layouts244.mjs
          node tests/perianal245.mjs
      - name: Restore existing key and build signed APK
        run: |
          python3 tools/restore_signing_key.py
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          ANDROID_SDK_ROOT="$ANDROID_HOME" bash build-apk.sh
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "build/MRIAtlas-${ATLAS_VERSION}-restored.apk" | head -n 1 | grep "versionCode='${ATLAS_CODE}' versionName='${ATLAS_VERSION}'"
          mkdir -p release
          cp "build/MRIAtlas-${ATLAS_VERSION}-restored.apk" "release/MRIAtlas-${ATLAS_VERSION}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "release/MRIAtlas-${ATLAS_VERSION}.apk" > release/signature.txt
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib,zipfile
          p=Path('release')/('MRIAtlas-'+os.environ['ATLAS_VERSION']+'.apk')
          z=zipfile.ZipFile(p);assert z.testzip() is None
          for f in Path('app/src/main/assets').rglob('*'):
              if f.is_file():assert z.read('assets/'+f.relative_to('app/src/main/assets').as_posix())==f.read_bytes()
          cert='cb7d43e1eb8ff4c1eee663e918b5413b70fb9d6f8221790075f83c7e153624fe'
          assert cert in Path('release/signature.txt').read_text()
          Path('release/build-info.json').write_text(json.dumps({'version':os.environ['ATLAS_VERSION'],'versionCode':int(os.environ['ATLAS_CODE']),'commit':os.environ['GITHUB_SHA'],'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'certificate_sha256':cert,'all_assets_verified':True},indent=2))
          PY
      - name: Save and verify the current release
        run: |
          tag="atlas-${ATLAS_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --latest
          else
            gh release create "$tag" release/* --target "$GITHUB_SHA" --title "MRIAtlas ${ATLAS_VERSION} · актуальная версия" --notes-file review/spine-2.46.md --latest
          fi
          mkdir -p verify-release
          gh release download "$tag" --pattern "MRIAtlas-${ATLAS_VERSION}.apk" --dir verify-release
          cmp "release/MRIAtlas-${ATLAS_VERSION}.apk" "verify-release/MRIAtlas-${ATLAS_VERSION}.apk"
      - name: Retain only the current application release
        if: env.ATLAS_VERSION == '2.44'
        run: |
          if gh release view atlas-2.43 >/dev/null 2>&1; then
            gh release delete atlas-2.43 --cleanup-tag --yes
          fi
