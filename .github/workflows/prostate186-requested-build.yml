name: MRI Atlas 1.86 - Prostate PI-RADS
on:
  push:
    branches: [work/orads-simplify-1-83]
    paths: [.github/workflows/prostate186-requested-build.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: atlas-release-signing
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ATLAS_STORE_PASSWORD: android
      ATLAS_KEY_PASSWORD: android
      ATLAS_KEY_ALIAS: atlas
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preservation of all previous assets
        run: |
          python3 - <<'PY'
          import subprocess
          base='5ea8849bd093b77fbda3076fe83337a1e2067d64'
          def tree(ref):
              raw=subprocess.check_output(['git','ls-tree','-r','-z',ref,'app/src/main/assets'])
              result={}
              for entry in raw.split(b'\0'):
                  if not entry: continue
                  meta,p=entry.split(b'\t',1)
                  result[p.decode()]=meta.split()[2]
              return result
          a,b=tree(base),tree('HEAD')
          for p,h in a.items():
              if p in {'app/src/main/assets/prostate-cancer.html','app/src/main/assets/prostate-cancer.js','app/src/main/assets/prostate-cancer.css','app/src/main/assets/menu-thumbs/prostate-cancer.svg'}: continue
              assert b.get(p)==h, 'Prior asset changed or deleted: '+p
          print('PASS unchanged previous assets:',len(a)-4)
          PY
      - name: Restore image assets
        run: |
          python3 tools/materialize_assets142.py
          python3 tools/materialize_assets150.py
          python3 tools/materialize_assets152.py
          python3 tools/materialize_assets165.py
      - name: Check routes and source data
        run: |
          node --check app/src/main/assets/prostate-cancer.js
          node tests/prostate186.mjs
          node tests/catalog142.mjs
          node tests/home163.mjs
          node tests/all-mri-data.mjs
      - name: Install browser dependency
        run: npm install --prefix /tmp/atlas-dom playwright --no-audit --no-fund
      - name: Check module on four screens and O-RADS regression
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node tests/browser-prostate186.mjs
          node tests/browser-ms184.mjs
          node tests/browser-orads183.mjs
      - name: Upload UI review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prostate186-ui-review
          path: |
            review/browser-prostate186/
            review/browser-ms184/
            review/browser-orads183/
          if-no-files-found: ignore
          retention-days: 7
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: |
          chmod +x build-apk.sh
          ANDROID_SDK_ROOT="$ANDROID_HOME" UNSIGNED_ONLY=1 ./build-apk.sh
      - name: Restore the same saved test signing key
        run: |
          set -euo pipefail
          mkdir -p saved-key signing
          gh release download atlas-1.83-personal-backup --pattern MRIAtlas-test-signing-key.zip --dir saved-key
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          p=Path('saved-key/MRIAtlas-test-signing-key.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='21e95c8f3b3b57579f8ad930e5dd011a7800efccc00750b003d70a5a9d9c87c6'
          with ZipFile(p) as z:
              assert z.testzip() is None
              Path('signing/atlas.keystore').write_bytes(z.read('atlas.keystore'))
              Path('signing/certificate.der').write_bytes(z.read('certificate.der'))
          PY
          keytool -exportcert -keystore signing/atlas.keystore -storepass:env ATLAS_STORE_PASSWORD -alias atlas -file current-cert.der
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          assert hashlib.sha256(Path('current-cert.der').read_bytes()).hexdigest()=='cb7d43e1eb8ff4c1eee663e918b5413b70fb9d6f8221790075f83c7e153624fe'
          assert Path('current-cert.der').read_bytes()==Path('signing/certificate.der').read_bytes()
          PY
      - name: Sign and verify payload and version
        run: |
          set -euo pipefail
          mkdir -p output
          bt="$ANDROID_HOME/build-tools/35.0.0"
          "$bt/zipalign" -c 4 build/MRIAtlas-1.86-unsigned.apk
          "$bt/apksigner" sign --ks signing/atlas.keystore --ks-pass env:ATLAS_STORE_PASSWORD --key-pass env:ATLAS_KEY_PASSWORD --ks-key-alias atlas --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false --out output/MRIAtlas-1.86.apk build/MRIAtlas-1.86-unsigned.apk
          "$bt/apksigner" verify --verbose --print-certs output/MRIAtlas-1.86.apk | tee output/signature.txt
          "$bt/aapt2" dump badging output/MRIAtlas-1.86.apk > output/package-info.txt
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib,json
          p=Path('output/MRIAtlas-1.86.apk')
          with ZipFile('build/MRIAtlas-1.86-unsigned.apk') as a, ZipFile(p) as b:
              assert b.testzip() is None
              original=set(a.namelist())
              assert original.issubset(set(b.namelist()))
              for n in original: assert a.read(n)==b.read(n),'Payload changed: '+n
              assert all(n.startswith('META-INF/') for n in set(b.namelist())-original)
              for f in Path('app/src/main/assets').rglob('*'):
                  if f.is_file(): assert b.read('assets/'+f.relative_to('app/src/main/assets').as_posix())==f.read_bytes()
              assert 'prostate-cancer' in b.read('assets/anatomy-regions.js').decode()
              assert 'PZpm' in b.read('assets/prostate-sectors186.js').decode()
          package=Path('output/package-info.txt').read_text().splitlines()[0]
          assert "name='ru.grigory.shoulderatlas.restored'" in package
          assert "versionCode='86'" in package and "versionName='1.86'" in package
          signature=Path('output/signature.txt').read_text().lower()
          assert 'cb7d43e1eb8ff4c1eee663e918b5413b70fb9d6f8221790075f83c7e153624fe' in signature
          assert 'verified using v2 scheme (apk signature scheme v2): true' in signature
          assert 'verified using v3 scheme (apk signature scheme v3): true' in signature
          info={'version':'1.86','signed':True,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size,'certificate_sha256':'cb7d43e1eb8ff4c1eee663e918b5413b70fb9d6f8221790075f83c7e153624fe','payload_verified':True,'base_commit':'5ea8849bd093b77fbda3076fe83337a1e2067d64','commit':__import__('os').environ['GITHUB_SHA']}
          Path('output/build-info.json').write_text(json.dumps(info,indent=2))
          PY
      - name: Save signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MRIAtlas-1.86-signed
          path: output/
          if-no-files-found: error
          retention-days: 30
      - name: Save installable APK in permanent personal release
        run: |
          gh release create atlas-1.86-prostate output/MRIAtlas-1.86.apk output/build-info.json output/signature.txt --target "$GITHUB_SHA" --prerelease --title "MRI Atlas 1.86 - Prostate PI-RADS" --notes "Рак простаты: полная секторная карта PI-RADS v2.1, 38 секторов простаты и 3 дополнительных региона, расшифровки и копирование локализации. Подписано тем же публичным тестовым ключом, что и 1.83. Проверено в Chromium на четырёх размерах; физический Android не проверен."
      - name: Clean runner key copy
        if: always()
        run: rm -rf signing saved-key current-cert.der
