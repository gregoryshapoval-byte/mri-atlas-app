<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" role="img" aria-labelledby="title desc"><title id="title">Schizas D</title><desc id="desc">Отдельные корешки и ликвор не видны. Задняя эпидуральная жировая клетчатка также не определяется. Передняя сторона сверху; задняя снизу. Условная аксиальная схема, не МРТ.</desc><rect width="520" height="380" rx="18" fill="#0d1822"/><text x="24" y="35" fill="#81cfc3" font-size="24" font-family="sans-serif">D</text><text x="260" y="35" text-anchor="middle" fill="#a7bdc9" font-family="sans-serif" font-size="15">ПЕРЕДНЯЯ СТОРОНА</text><ellipse cx="260" cy="186" rx="165" ry="132" fill="#253d4c" stroke="#55717f" stroke-width="2"/><ellipse cx="260" cy="181" rx="91" ry="57" fill="#8199a7" stroke="#81cfc3" stroke-width="4"/><text x="260" y="355" text-anchor="middle" fill="#a7bdc9" font-family="sans-serif" font-size="15">ЗАДНЯЯ СТОРОНА</text></svg>