<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" role="img" aria-labelledby="title desc"><title id="title">Schizas A1</title><desc id="desc">Корешки дорсально, занимают менее половины площади дурального мешка. Ликвор хорошо виден. Передняя сторона сверху; задняя снизу. Условная аксиальная схема, не МРТ.</desc><rect width="520" height="380" rx="18" fill="#0d1822"/><text x="24" y="35" fill="#81cfc3" font-size="24" font-family="sans-serif">A1</text><text x="260" y="35" text-anchor="middle" fill="#a7bdc9" font-family="sans-serif" font-size="15">ПЕРЕДНЯЯ СТОРОНА</text><ellipse cx="260" cy="186" rx="165" ry="132" fill="#253d4c" stroke="#55717f" stroke-width="2"/><path data-posterior-fat="present" d="M176 296 Q260 332 344 296 Q260 312 176 296Z" fill="#e9c67f"/><ellipse cx="260" cy="181" rx="130" ry="99" fill="#c6e9f1" stroke="#81cfc3" stroke-width="4"/><circle cx="202.0" cy="216.0" r="6.5" fill="#243b4c"/><circle cx="226.0" cy="216.0" r="6.5" fill="#243b4c"/><circle cx="250.0" cy="216.0" r="6.5" fill="#243b4c"/><circle cx="274.0" cy="216.0" r="6.5" fill="#243b4c"/><circle cx="298.0" cy="216.0" r="6.5" fill="#243b4c"/><circle cx="322.0" cy="216.0" r="6.5" fill="#243b4c"/><circle cx="202.0" cy="235.0" r="6.5" fill="#243b4c"/><circle cx="226.0" cy="235.0" r="6.5" fill="#243b4c"/><circle cx="250.0" cy="235.0" r="6.5" fill="#243b4c"/><circle cx="274.0" cy="235.0" r="6.5" fill="#243b4c"/><circle cx="298.0" cy="235.0" r="6.5" fill="#243b4c"/><circle cx="322.0" cy="235.0" r="6.5" fill="#243b4c"/><circle cx="202.0" cy="252.0" r="6.5" fill="#243b4c"/><circle cx="226.0" cy="252.0" r="6.5" fill="#243b4c"/><circle cx="250.0" cy="252.0" r="6.5" fill="#243b4c"/><circle cx="274.0" cy="252.0" r="6.5" fill="#243b4c"/><circle cx="298.0" cy="252.0" r="6.5" fill="#243b4c"/><circle cx="322.0" cy="252.0" r="6.5" fill="#243b4c"/><text x="260" y="355" text-anchor="middle" fill="#a7bdc9" font-family="sans-serif" font-size="15">ЗАДНЯЯ СТОРОНА</text></svg>