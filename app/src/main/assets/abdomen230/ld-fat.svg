<svg xmlns="http://www.w3.org/2000/svg" width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="title desc"><title id="title">ld-fat</title><desc id="desc">Условная учебная схема. Сравнение сигналов · изображения условные. Цифры соответствуют легенде. Без масштаба.</desc><rect width="420" height="340" rx="18" fill="#101c28"/><text x="16" y="24" fill="#b5c9df" font-size="12">Сравнение сигналов · изображения условные</text><ellipse cx="75" cy="170" rx="54" ry="62" fill="#82998b" stroke="#4a8973" stroke-width="2"/><text x="36" y="80" fill="#b5c9df" font-size="13">in-phase</text><path d="M75 273 L75 184" fill="none" stroke="#c8d6e8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="75" cy="273" r="12" fill="#26394d" stroke="#e4f3ff"/><text x="75" y="278" fill="white" text-anchor="middle" font-size="15">1</text><ellipse cx="210" cy="170" rx="54" ry="62" fill="#36483c" stroke="#4a8973" stroke-width="2"/><text x="171" y="80" fill="#b5c9df" font-size="13">opposed-phase</text><path d="M210 273 L210 184" fill="none" stroke="#c8d6e8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="210" cy="273" r="12" fill="#26394d" stroke="#e4f3ff"/><text x="210" y="278" fill="white" text-anchor="middle" font-size="15">2</text><ellipse cx="345" cy="170" rx="54" ry="62" fill="#d5ae51" stroke="#4a8973" stroke-width="2"/><text x="306" y="80" fill="#b5c9df" font-size="13">PDFF</text><path d="M345 273 L345 184" fill="none" stroke="#c8d6e8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="345" cy="273" r="12" fill="#26394d" stroke="#e4f3ff"/><text x="345" y="278" fill="white" text-anchor="middle" font-size="15">3</text><text x="16" y="325" fill="#b5c9df" font-size="11">Условная схема · без масштаба · не МРТ</text></svg>