plugins { id 'com.android.application' }
android {
 namespace 'ru.grigory.shoulderatlas'
 compileSdk 35
 defaultConfig {
  applicationId 'ru.grigory.shoulderatlas.restored'
  minSdk 26
  targetSdk 35
  versionCode 247
  versionName '3.47'
 }
 sourceSets { main { assets.srcDirs = [rootProject.file('build/runtime-assets')] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}


// The historical app/src/main/assets tree is not a release input.
tasks.register('prepareCurrentRuntime', Exec) {
 workingDir rootProject.projectDir
 commandLine 'python3', 'tools/prepare_runtime.py'
}
tasks.named('preBuild').configure { dependsOn 'prepareCurrentRuntime' }
